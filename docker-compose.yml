services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: reqflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-reqflow}
      POSTGRES_USER: ${POSTGRES_USER:-reqflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-reqflow_dev_only_change_me}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-reqflow} -d ${POSTGRES_DB:-reqflow}"]
      interval: 5s
      timeout: 5s
      retries: 15

  redis:
    image: redis:7-alpine
    container_name: reqflow-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    container_name: reqflow-ollama
    restart: unless-stopped
    environment:
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-300}
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: reqflow-backend
    restart: unless-stopped
    env_file: [.env]
    working_dir: /app/backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-reqflow}:${POSTGRES_PASSWORD:-reqflow_dev_only_change_me}@postgres:5432/${POSTGRES_DB:-reqflow}
      REDIS_URL: redis://redis:6379/0
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-300}
      PYTHONPATH: /app:/app/backend
    ports: ["8000:8000"]
    volumes:
      - ./backend:/app/backend
      - ./agents:/app/agents
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_started
    command: uvicorn app.main:app --app-dir /app/backend --host 0.0.0.0 --port 8000 --reload

  frontend:
    image: node:22-alpine
    container_name: reqflow-frontend
    working_dir: /app
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    ports: ["3000:5173"]
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on: [backend]

volumes:
  postgres_data:
  frontend_node_modules:
  ollama_data:
